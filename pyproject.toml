[project]
name = "llama-index-readers-hydrafetch"
version = "0.2.0"
description = "LlamaIndex reader for Hydrafetch. Load clean, LLM-ready web data into an index."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Hydrafetch", email = "team@hydrafetch.com" }]
keywords = ["llama-index", "llamaindex", "hydrafetch", "web-scraping", "markdown", "rag", "reader"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["llama-index-core>=0.12,<0.16", "hydrafetch>=0.1.1"]

[project.urls]
Homepage = "https://hydrafetch.com"
Documentation = "https://docs.hydrafetch.com"
Source = "https://github.com/Hydrafetch/llama-index-readers-hydrafetch"
Issues = "https://github.com/Hydrafetch/llama-index-readers-hydrafetch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.readers.hydrafetch"

[tool.llamahub.class_authors]
HydrafetchReader = "hydrafetch"
